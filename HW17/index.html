<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <main class="main">
        <div class="container">
          <section class="portfolio">
            <!--Секция-->
            <h2 class="portfolio__title">Portfolio</h2>
            <!--Заголовок-->
            <div class="portfolio__content">
              <!--Общий блок-->
              <nav class="portfolio__menu">
                <!--Навигация блок слева-->
                <ul class="portfolio__menu-list">
                  <li class="portfolio__menu-item">WOMAN</li>
                  <li class="portfolio__menu-item">MAN</li>
                  <li class="portfolio__menu-item">CAMPAIGN</li>
                  <li class="portfolio__menu-item">SALE</li>
                </ul>
              </nav>
              <div class="portfolio__image">
                <!--Блок посередине-Картинка-->
                <img class="portfolio__image" src="#" alt="New collection" />
                <h3 class="portfolio__image-title">New collection</h3>
              </div>
              <div class="portfolio__right">
                <!--Блок справа-Поиск и текст-->
                <div class="portfolio__search">
                  <input class="portfolio__search-input" type="text" placeholder="Search" />
                </div>
                <div class="portfolio__text">
                  <p class="portfolio__subtitle">Levis jacket jeans trucker</p>
                  <p class="portfolio__description">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis asperiores fugit ipsam rem
                  </p>
                </div>
              </div>
            </div>
            <div class="portfolio__socials">
              <!--Социальные сети-->
              <a href="#" class="portfolio__social-link">Instagram</a>
              <a href="#" class="portfolio__social-link">Facebook</a>
              <a href="#" class="portfolio__social-link">Twitter</a>
              <a href="#" class="portfolio__social-link">Pinterest</a>
              <a href="#" class="portfolio__social-link">YouTube</a>
            </div>
            <a href="#" class="portfolio__homepage">Online fashion store - Homepage</a>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
