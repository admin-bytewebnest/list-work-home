<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <table border="1" class="table">
      <caption>Таблица заказов товара</caption>
      <thead>
        <tr bgcolor="yellow">
          <th>Имя клиента</th>
          <th>Название товара</th>
          <th>Количество</th>
          <th>Стоимость</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Василий</th>
          <td>Хлеб</td>
          <td>1 шт</td>
          <td>20 грн</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>Итого:</th>
          <td colspan="3" align="end">20 грн</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
