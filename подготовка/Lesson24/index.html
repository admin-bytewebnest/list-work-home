<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="#">
      <label for="name"></label>
      <input type="text" id="name" name="name" required placeholder="" />

      <label for="email"></label>
      <input type="email" id="email" name="email" required placeholder="" />

      <label for="site"></label>
      <input type="url" id="site" name="site" />

      <label for="search"></label>
      <input type="search" id="search" name="search" />

      <label for="date"></label>
      <input type="date" id="date" name="date" />

      <label for="time"></label>
      <input type="time" id="time" name="time" />

      <label for="color"></label>
      <input type="color" id="color" name="color" />

      <div>
        <label for="products"></label>
        <select name="products" id="products">
          <option value=""></option>
          <option value=""></option>
          <option value=""></option>
        </select>
      </div>

      <label for="range"></label>
      <input type="range" id="range" name="range" min="0" max="100" value="25" />

      <label for="file"></label>
      <input type="file" id="file" name="file" />

      <label for="comment"></label>
      <textarea name="comment" id="comment" placeholder=""></textarea>
      <br />
      <div>
        <label for="radio1">1</label>
        <input type="radio" id="radio1" name="radio" value="1" />
        <label for="radio2">2</label>
        <input type="radio" id="radio2" name="radio" value="2" checked />
        <label for="radio3">3</label>
        <input type="radio" id="radio3" name="radio" value="3" />
      </div>

      <div>
        <label for="yes">Согласен</label>
        <input type="checkbox" id="yes" name="agree" value="yes" checked>
        <label for="No">Не согласен</label>
        <input type="checkbox" id="No" name="agree" value="No" disabled>
      </div>

      <button type="submit"></button>

    </form>
  </body>
</html>
