<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <table class="table" width="100%">
        <caption class="caption--text-left">Многоуровневая структура</caption>
        <thead>
          <tr>
            <th>Тема</th>
            <th>Тип</th>
            <th>Цветовая схема</th>
            <th>Компоненты</th>
            <th>Состояния</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td rowspan="3">Light Theme</td>
            <td rowspan="3">Светлая</td>
            <td rowspan="3">
              <table class="table">
                <thead>
                  <tr>
                    <th colspan="3">Основные цвета</th>
                  </tr>
                  <tr>
                    <td style="background-color: white"></td>
                    <td style="background-color: silver"></td>
                    <td style="background-color: blue"></td>
                  </tr>
                  <tr>
                    <td colspan="3" style="text-align: center">Оттенки</td>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="3">
                      <table style="width: 100%">
                        <tbody>
                          <tr>
                            <td>Белый</td>
                            <td><code>#ffffff</code></td>
                          </tr>
                          <tr>
                            <td>Серый</td>
                            <td><code>#ccc</code></td>
                          </tr>
                          <tr>
                            <td>Синий</td>
                            <td><code>#2563eb</code></td>
                          </tr>
                        </tbody>
                      </table>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
            <td>
              <table class="table" width="100%">
                <thead>
                  <tr>
                    <th colspan="2" style="background-color: gray">Кнопка</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Основная</td>
                  </tr>
                </tbody>
              </table>
            </td>
            <td>
              <table width="100%">
                <thead>
                  <tr>
                    <th colspan="2" style="background-color: gray">Состояния</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <table class="table" width="100%">
                        <tr>
                          <td style="background-color: rgb(93, 93, 243)">Hover</td>
                        </tr>
                        <tr>
                          <td style="background-color: rgb(17, 17, 232)">Active</td>
                        </tr>
                        <tr>
                          <td style="background-color: rgb(44, 44, 178)">Disabled</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
          <tr>
            <td>
              <table class="table" width="100%">
                <thead>
                  <tr>
                    <th colspan="2" style="background-color: gray">Input</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Поле ввода</td>
                  </tr>
                </tbody>
              </table>
            </td>
            <td>
              <table width="100%">
                <thead>
                  <tr>
                    <th colspan="2" style="background-color: gray">Состояния</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <table class="table" width="100%">
                        <tr>
                          <td style="background-color: rgb(93, 93, 243)">Normal</td>
                        </tr>
                        <tr>
                          <td style="background-color: rgb(17, 17, 232)">Focused</td>
                        </tr>
                        <tr>
                          <td style="background-color: rgb(44, 44, 178)">Disabled</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
          <tr>
            <td>
              <table class="table" width="100%">
                <thead>
                  <tr>
                    <th colspan="2" style="background-color: gray">Card</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Карточка</td>
                  </tr>
                </tbody>
              </table>
            </td>
            <td>
              <table class="table" width="100%">
                <thead>
                  <tr>
                    <th colspan="2" style="background-color: gray">Состояния</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <table class="table" width="100%">
                        <tr>
                          <td style="background-color: rgb(93, 93, 243)">Default</td>
                        </tr>
                        <tr>
                          <td style="background-color: rgb(17, 17, 232)">Hover</td>
                        </tr>
                        <tr>
                          <td style="background-color: rgb(44, 44, 178)">Selected</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
