<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <aside>
    <!-- Боковое меню -->
  </aside>

  <ol>
    <!-- Нумерованный список -->
    <li>Первый</li>
    <li>Второй</li>
  </ol>

  <article>
    <!-- Статьи -->
    <header>
    <!-- Шапка статьи -->
    </header>
    <h2>Заголовок статьи</h2>
    <p>Абзац статьи</p>
    <footer>
    <!-- Завершение статьи -->
    </footer>
  </article>

  <blockquote>
    <!-- Цитаты, оборачивается в спан или р -->
  </blockquote>
  <span>
    <blockquote></blockquote>
  </span><p></p>

  <picture>
    <!-- Адаптив картинок -->
    <source media="" srcset="images/ico.png"></source>
    <source media=""></source>
    <img src="" alt="">
    <!-- Основа -->
  </picture>

  <pre>
    <!-- Указываем код -->
    .container{
      width: 1440px;
      margin: auto;
    }
  </pre>
  <!-- Без пробела -->
  <code>
    .container{
      width: 1440px;
      margin: auto;
    }
  </code>

  <address>
    <!-- Адрес -->
    Город: Одесса
  </address>

  <strong>
    <!-- Жирный текст -->
  </strong>

  <!-- Отступ на новый ряд -->
  <br>

  <!-- Горизонтальная линия -->
  <hr>

  <em>
    <!-- Курсивный текст -->
  </em>

  <script src="js/script.js">
    // Java Script
  </script>

  <!-- Карты,видео,аудио -->
  <iframe src="" frameborder="0"></iframe>
  <video src=""></video>
  <audio src=""></audio>

  <mark>
    <!-- Главная мысль, сделать акцент на фразе, контент -->
  </mark>

  <small>
    <!-- Маленький текст -->
  </small>

  <big>
    <!-- Большой текст -->
  </big>

  <!-- Формула -->
  Формула воды: <P>H<sup>2</sup>O</P>

  <canvas>
    <!-- Отрисовка графики, вектора изображений -->
  </canvas>

  <!-- post-картинка,файл. get-отображается в url -->
  <form action="#" method="post">
  <input type="password" placeholder="Введите пароль">
  <input type="submit" value="Отправить">
    <!-- Добавляется выбор между чем-то. Радиокнопки-->
  <label for="radio">Темное пиво</label>
  <!-- Появляется квадратик для галочки -->
  <input type="checkbox">
  </form>

  <!-- Выпадающий список -->
  <select name="" id="">
    <option value="">Первый пункт</option>
    <option value="">Второй пункт</option>
  </select>
