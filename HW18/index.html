<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <!-- Вынес рекламу из контейнера -->
        <!-- Верхняя часть Хедера -->
        <div class="header__top">
          <img src="#" alt="Рекламный баннер" />
        </div>

        <div class="container">
          <!-- header__middle header__middle--grid Подсмотрел в чат гпт,не знаю можно ли так применять -->
          <!-- Средняя часть Хедера -->
          <div class="header__middle header__middle--grid">
            <!-- Лого -->
            <div class="header__logo">
              <svg class="header__logo-icon"></svg>
              <div class="header__logo-text">
                <p class="header__logo-name">Wonder Tour</p>
                <p class="header__logo-free">Free</p>
              </div>
            </div>
            <!-- Время работы -->
            <div class="header__time">
              <svg class="header__icon"></svg>
              <p class="header__time-text">09:00AM - 05:00PM</p>
            </div>
            <!-- Контакты -->
            <div class="header__phone">
              <svg class="header__icon"></svg>
              <p class="header__phone-text">+380504563421</p>
            </div>
            <!-- Кнопка -->
            <div class="header__button">
              <a class="header__btn" href="#">Get a free quote</a>
            </div>
          </div>
          <!-- Нижняя часть Хедера -->
          <div class="header__down header__down--grid">
            <!-- Навигация -->
            <nav class="nav header__nav">
              <ul class="nav__list">
                <li class="nav__item"><a class="nav__link" href="#"></a>Home</li>
                <li class="nav__item"><a class="nav__link" href="#"></a>About</li>
                <li class="nav__item"><a class="nav__link" href="#"></a>Tupography</li>
                <li class="nav__item"><a class="nav__link" href="#"></a>Contact Us</li>
              </ul>
            </nav>
            <!-- Социальные сети -->
            <div class="header__socials">
              <a class="header__social-link" href="#" aria-label="Facebook">
                <svg></svg>
              </a>
              <a class="header__social-link" href="#" aria-label="Twitter">
                <svg></svg>
              </a>
              <a class="header__social-link" href="#" aria-label="Google+">
                <svg></svg>
              </a>
              <a class="header__social-link" href="#" aria-label="Instagram">
                <svg></svg>
              </a>
            </div>
          </div>
        </div>
      </header>
      <main class="main">
        <section class="main__hero main__hero--grid">
          <!-- Вынес баннер из контейнера чтоб не центрировался -->
          <img src="#" alt="Баннер" />
          <div class="container">
            <h2 class="main__subtitle">Build your next holiday trip with us</h2>
            <h1 class="main__title">Create <span>Your Tour</span></h1>
            <a href="#" class="main__btn">Get in touch</a>
          </div>
        </section>
      </main>
      <footer class="footer">
        <div class="container"></div>
      </footer>
    </div>
  </body>
</html>
